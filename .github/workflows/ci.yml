name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yourtime_test
          POSTGRES_USER: yourtime
          POSTGRES_PASSWORD: yourtime
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U yourtime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -tags integration ./...
      - name: Unit and end-to-end tests
        env:
          TEST_DATABASE_URL: postgres://yourtime:yourtime@localhost:5432/yourtime_test?sslmode=disable
        run: go test -race -count=1 -tags integration ./...
      - name: Build
        run: go build -o /tmp/server ./cmd/server

  javascript:
    name: Shared packages and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: pnpm typecheck
      - name: Shared package tests
        run: pnpm test
      - name: Bundle the app (catches Metro and import errors)
        run: pnpm --filter @yourtime/mobile build

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: infra/docker/Dockerfile.backend
          push: false
          tags: yourtime/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
