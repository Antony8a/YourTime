name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ===========================================
  # LINT & FORMAT
  # ===========================================
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

  # ===========================================
  # TYPESCRIPT TYPE CHECK
  # ===========================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types
        run: pnpm run generate:types

      - name: Type check
        run: pnpm run typecheck

  # ===========================================
  # GO: LINT, TEST, BUILD
  # ===========================================
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yourtime_test
          POSTGRES_USER: yourtime
          POSTGRES_PASSWORD: yourtime
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U yourtime"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: ./apps/backend
        run: go mod download

      - name: Run golangci-lint
        working-directory: ./apps/backend
        run: golangci-lint run --timeout=5m

      - name: Run tests
        working-directory: ./apps/backend
        env:
          DATABASE_URL: postgres://yourtime:yourtime@localhost:5432/yourtime_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-testing-only-32-chars-minimum
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Build
        working-directory: ./apps/backend
        run: go build -v -o /tmp/server ./cmd/server

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  # ===========================================
  # ANGULAR: TEST & BUILD
  # ===========================================
  angular-checks:
    name: Angular Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared types
        run: pnpm run generate:types

      - name: Run tests
        working-directory: ./apps/web
        run: npm run test -- --watch=false --code-coverage

      - name: Build
        working-directory: ./apps/web
        run: npm run build -- --configuration production

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/web/coverage/**/coverage-final.json
          flags: web
          fail_ci_if_error: false

  # ===========================================
  # REACT NATIVE: TEST & TYPE CHECK
  # ===========================================
  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared types
        run: pnpm run generate:types

      - name: Type check
        working-directory: ./apps/mobile
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./apps/mobile
        run: npm run test -- --watchAll=false --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/mobile/coverage/**/coverage-final.json
          flags: mobile
          fail_ci_if_error: false

  # ===========================================
  # DOCKER BUILD
  # ===========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-checks, angular-checks, mobile-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          load: true
          tags: yourtime/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          load: true
          tags: yourtime/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # DEPLOY STAGING (manual)
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, go-checks, angular-checks, mobile-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your deployment logic here
          # e.g., kubectl apply, flyctl deploy, railway up, etc.

  # ===========================================
  # DEPLOY PRODUCTION (manual approval)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, go-checks, angular-checks, mobile-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your deployment logic here