version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/infrastructure/persistence/postgres/migrations"
    queries: "internal/infrastructure/persistence/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/persistence/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "json.RawMessage"
          - db_type: "numeric"
            go_type: "string"
        renames:
          - from: "id"
            to: "ID"
          - from: "created_at"
            to: "CreatedAt"
          - from: "updated_at"
            to: "UpdatedAt"
          - from: "deleted_at"
            to: "DeletedAt"