root: "."
testdata_dir: "testdata"
tmp_dir: "tmp"

build:
  args_bin: []
  bin: "./tmp/server"
  cmd: "go build -o ./tmp/server ./cmd/server"
  delay: 1000
  exclude_dir: ["assets", "tmp", "vendor", "testdata", "node_modules", ".git"]
  exclude_file: ["_test.go", ".sql.go", "wire_gen.go"]
  exclude_regex: ["_test\\.go$", "\\.sql\\.go$", "wire_gen\\.go$"]
  exclude_unchanged: true
  follow_symlink: true
  full_bin: ""
  include_dir: ["cmd", "internal", "pkg"]
  include_ext: ["go", "tpl", "tmpl", "html"]
  kill_delay: 500
  log: "build-errors.log"
  poll: false
  poll_interval: 0
  rerun: false
  rerun_delay: 1000
  send_interrupt: true
  stop_on_error: true

color:
  app: ""
  build: "yellow"
  main: "magenta"
  runner: "green"
  watcher: "cyan"

log:
  time: false

misc:
  clean_on_exit: true